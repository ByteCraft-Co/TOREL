name: Compiler bug
description: Report incorrect TOREL compiler behavior.
title: "[Bug] "
labels:
  - "area:compiler"
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a TOREL compiler problem. Minimize the reproduction when possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest source or command sequence that reproduces the problem.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Compiler revision
      description: Commit hash, branch, or release identifier.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows x86-64, Linux x86-64, etc.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: Include relevant diagnostics. Remove secrets or private data first.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain a private security vulnerability.
          required: true
